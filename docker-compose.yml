services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: polla_db
      POSTGRES_USER: polla_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polla_user -d polla_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    env_file: ./backend/.env
    # DATABASE_URL / REDIS_URL must use the same passwords as postgres/redis above (root .env).
    environment:
      DATABASE_URL: postgresql+asyncpg://polla_user:${POSTGRES_PASSWORD}@postgres:5432/polla_db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --proxy-headers
      - --reload

  # Frontend directo: en algunos equipos Windows, "localhost" resuelve a IPv6 (::1) y el
  # puerto publicado no responde en el navegador. Usa http://127.0.0.1:3000 si pasa eso.
  frontend:
    build: ./frontend
    env_file: ./frontend/.env
    depends_on:
      - backend
    ports:
      - "3000:3000"

  # Entrada unificada (API + web): mismo aviso Windows — prueba http://127.0.0.1 si localhost falla.
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend

  # Backup diario a medianoche (TZ): PostgreSQL + fotos de perfil → volumen backup_data
  db-backup:
    build: ./scripts/backup
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: polla_db
      POSTGRES_USER: polla_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-America/Lima}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - backup_data:/backups
      - uploads_data:/uploads:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Reinicio total de datos (marcha blanca). Requiere CONFIRM_RESET=yes
  db-reset:
    image: alpine:3.20
    profiles: ["tools"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: polla_user
      PGDATABASE: polla_db
      PGPASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CONFIRM_RESET: ${CONFIRM_RESET:-}
      SKIP_REDIS: ${SKIP_REDIS:-}
    volumes:
      - ./scripts/reset-polla:/scripts:ro
    entrypoint:
      - /bin/sh
      - -c
      - apk add --no-cache postgresql16-client redis >/dev/null && /bin/sh /scripts/reset-polla.sh
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
  backup_data:
