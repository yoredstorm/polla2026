services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: polla_db
      POSTGRES_USER: polla_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dokploy-network
    ports:
      - "5432:5432"
    # Do not publish 5432 — DB must stay on dokploy-network only (see docs/SECURITY_PRODUCTION.md)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polla_user -d polla_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    # Dokploy Environment (only these are required for interpolation):
    # POSTGRES_PASSWORD, REDIS_PASSWORD, JWT_SECRET_KEY, JWT_REFRESH_SECRET
    # Optional: SENTRY_DSN, VAPID_*, NEXT_PUBLIC_API_URL (frontend build)
    # Do NOT set DATABASE_URL/REDIS_URL here — compose uses hostnames postgres/redis.
    environment:
      DATABASE_URL: postgresql+asyncpg://polla_user:${POSTGRES_PASSWORD}@postgres:5432/polla_db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      APP_ENV: production
      DEBUG: "false"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      CORS_ORIGINS: https://redcardtech.uk
      LOG_LEVEL: INFO
      SENTRY_DSN: ${SENTRY_DSN:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_CLAIMS_SUB: ${VAPID_CLAIMS_SUB:-mailto:admin@redcardtech.uk}
    networks:
      - dokploy-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    networks:
      - dokploy-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.polla-http.rule=Host(`redcardtech.uk`)
      - traefik.http.services.polla-web.loadbalancer.server.port=80
    networks:
      - dokploy-network
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  db-backup:
    build: ./scripts/backup
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: polla_db
      POSTGRES_USER: polla_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-America/Lima}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - backup_data:/backups
      - uploads_data:/uploads:ro
    networks:
      - dokploy-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
  backup_data:

networks:
  dokploy-network:
    external: true
